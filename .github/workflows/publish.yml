name: Stage TypeScript SDK on npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      package-release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24.22.1 ships npm 11.19.1, which supports staged publishing.
          node-version: '^24.22.1'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release

      - name: Stage the verified tarball
        working-directory: ${{ runner.temp }}/npm-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          dist_tag=latest
          if [[ "$IS_PRERELEASE" == "true" || "${RELEASE_TAG%%+*}" == *-* ]]; then
            dist_tag=beta
          fi
          set -- ./*.tgz
          test "$#" -eq 1
          test -f "$1"
          npm stage publish "$1" --access public --tag "$dist_tag" --registry=https://registry.npmjs.org
