name: Publish TypeScript SDK to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      package-release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release

      - name: Publish the verified tarball
        working-directory: ${{ runner.temp }}/npm-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          dist_tag=latest
          if [[ "$IS_PRERELEASE" == "true" || "${RELEASE_TAG%%+*}" == *-* ]]; then
            dist_tag=beta
          fi
          set -- ./*.tgz
          test "$#" -eq 1
          test -f "$1"
          pnpm publish "$1" --access public --tag "$dist_tag" --registry=https://registry.npmjs.org
